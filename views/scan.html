<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Escanear · Flex Scanner</title>
<script>try { const t = localStorage.getItem('fx-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="icon" href="/logo">
<link rel="apple-touch-icon" href="/logo">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  main { max-width: 560px; padding: 12px; }
  #reader { width: 100%; border-radius: 16px; overflow: hidden; background: #000; min-height: 260px; border: 1px solid var(--line); }
  #reader video { object-fit: cover; }
  .result { border-radius: 16px; padding: 16px; margin-top: 12px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
  .result.ok { border-color: var(--ok); border-width: 2px; }
  .result.err { background: var(--err-bg); border-color: var(--err); color: var(--err); }
  .result .name { font-size: 21px; font-weight: 700; margin: 2px 0 6px; }
  .result .line { margin: 3px 0; }
  .result .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hist { list-style: none; padding: 0; margin: 8px 0 0; }
  .hist li { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .status { font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/logo" alt="" class="icon">
    <div><img src="/logo-text.png" alt="BIOGATE" class="word"><div class="s">Escanear etiquetas Flex</div></div>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema"></button>
  <a class="btn small" href="/">Panel</a>
</header>
<main>
  <div id="reader"></div>
  <div class="row" style="margin-top:10px">
    <button class="btn primary" id="toggle">Iniciar cámara</button>
    <span class="status muted" id="status"></span>
  </div>

  <div id="result"></div>

  <details class="card" style="margin-top:12px">
    <summary style="cursor:pointer">Cargar número de envío a mano</summary>
    <form class="row" id="manual" style="margin-top:10px">
      <input type="text" inputmode="numeric" id="manualId" placeholder="Ej: 41234567890" style="flex:1">
      <button class="btn primary">Buscar</button>
    </form>
  </details>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <strong>Esta sesión: <span id="count">0</span> envíos</strong>
      <span class="price" id="sessTotal">$ 0</span>
    </div>
    <ul class="hist" id="hist"></ul>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (n) => '$ ' + Math.round(n || 0).toLocaleString('es-AR');
const ZN = { CAPITAL: 'Capital', GBA1: 'GBA 1', GBA2: 'GBA 2', GBA3: 'GBA 3' };
let scanner = null, running = false, busy = false, last = { text: '', t: 0 };
const session = new Map();

// Tema
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function setTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  try { t ? localStorage.setItem('fx-theme', t) : localStorage.removeItem('fx-theme'); } catch {}
  $('themeBtn').innerHTML = isDark() ? SUN : MOON;
}
$('themeBtn').onclick = () => setTheme(isDark() ? 'light' : 'dark');
setTheme(document.documentElement.dataset.theme || '');

// Sonidos: agudo si salió bien, grave si hubo error.
let actx;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 1200 : 300; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.15, actx.currentTime); o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.35));
  } catch {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [80, 60, 80]);
}

let current = null, welcome = '', waWelcome = '';
fetch('/api/settings').then(r => r.json()).then(st => { welcome = st.welcome || ''; waWelcome = st.wa_welcome || ''; }).catch(() => {});
function waLink(phone) {
  let d = String(phone || '').replace(/\D/g, '').replace(/^00/, '');
  if (d.length < 8) return '';
  if (d.startsWith('54')) d = d.slice(2);
  d = d.replace(/^0/, '').replace(/^9/, '');
  return `https://wa.me/549${d}`;
}
const firstWord = (v) => { const w = String(v || '').trim().split(/\s+/)[0] || ''; return w ? w[0].toUpperCase() + w.slice(1).toLowerCase() : ''; };
const personalize = (tpl, s) => tpl.replace(/\{nombre\}/gi, firstWord(s.first_name || s.receiver_name)).replace(/\{envio\}/gi, s.shipment_id).trim();
function suggHtml(s) {
  if (!welcome) return '';
  const text = personalize(welcome, s);
  const sent = (s.messages || []).some(m => m.ok && m.channel !== 'whatsapp');
  return `<div style="margin-top:12px;padding:12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line)">
    <div class="row" style="justify-content:space-between"><b style="font-size:14px">Mensaje sugerido</b><span class="muted" style="font-size:12px">${text.length} / 350</span></div>
    <div style="font-size:14px;white-space:pre-wrap;margin:6px 0 10px">${esc(text)}</div>
    <div class="row">
      <button class="btn primary small" id="suggSend" ${text.length > 350 ? 'disabled' : ''}>${sent ? 'Enviar de nuevo' : 'Enviar por Mercado Libre'}</button>
      <button class="btn small" id="suggWa" title="Abre WhatsApp con la versión completa del mensaje">WhatsApp</button>
      <button class="btn small" id="suggCopy">Copiar</button>
      <span id="suggRes" style="font-size:13px"></span>
    </div>
    ${sent ? '<div class="muted" style="font-size:12px;margin-top:6px">A este cliente ya le mandaste un mensaje.</div>' : ''}
  </div>`;
}
async function suggSend() {
  $('suggSend').disabled = true; $('suggRes').textContent = 'Enviando…'; $('suggRes').className = 'muted';
  try {
    const r = await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ shipment_ids: [current.shipment_id], text: welcome }) });
    const d = await r.json();
    const res = d.results && d.results[0];
    if (!d.ok || !res || !res.ok) throw new Error((res && res.error) || d.error || 'Error');
    $('suggRes').textContent = '✓ Enviado'; $('suggRes').className = 'ok-t'; beep(true);
  } catch (e) { $('suggRes').textContent = e.message; $('suggRes').className = 'err-t'; $('suggSend').disabled = false; }
}
function suggWa() {
  const link = !needsPhone(current) && waLink(current.phone);
  if (!link) { $('suggRes').textContent = 'Primero cargá el teléfono de WhatsApp.'; $('suggRes').className = 'err-t'; if ($('phoneInput')) $('phoneInput').focus(); return; }
  const text = personalize(waWelcome || welcome, current);
  window.open(link + '?text=' + encodeURIComponent(text), 'whatsapp');
  fetch(`/api/scans/${current.shipment_id}/walog`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
}
function bindSugg() {
  if ($('suggWa')) $('suggWa').onclick = suggWa;
  if ($('suggSend')) $('suggSend').onclick = suggSend;
  if ($('suggCopy')) $('suggCopy').onclick = async () => { try { await navigator.clipboard.writeText(personalize(welcome, current)); $('suggRes').textContent = 'Copiado'; $('suggRes').className = 'muted'; } catch {} };
}
const needsPhone = (s) => !s.phone || s.phone_hidden || /XXX/i.test(s.phone);
const saleUrl = (s) => s.sale_url || ((s.pack_id || s.order_id) ? `https://www.mercadolibre.com.ar/ventas/${s.pack_id || s.order_id}/detalle` : '');
function phoneHtml(s) {
  if (!needsPhone(s)) {
    return `<div class="line">Tel: <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a>${s.phone_manual ? ' <span class="muted">(cargado a mano)</span> <a href="#" onclick="editPhone();return false">cambiar</a>' : ''}</div>`;
  }
  return `<div class="line muted">Tel: oculto por Mercado Libre. Cargalo acá:</div>
    <form class="row" onsubmit="savePhone(event)" style="margin-top:6px">
      <input type="tel" id="phoneInput" placeholder="Ej: 11 6808 3339" style="flex:1;font-size:18px" value="${esc(s.phone_manual ? s.phone : '')}">
      <button class="btn primary">Guardar</button>
    </form>`;
}
function zoneHtml(s) {
  return s.zone
    ? `<div style="text-align:right"><span class="zone z-${s.zone}">${ZN[s.zone]}</span><div class="price" style="font-size:17px;margin-top:3px">${money(s.cost)}</div></div>`
    : `<span class="pill">sin zona</span>`;
}
function editPhone() { current.phone_hidden = true; $('phoneBox').innerHTML = phoneHtml(current); $('phoneInput').focus(); }
async function savePhone(e) {
  e.preventDefault();
  const phone = $('phoneInput').value.trim();
  if (!phone) return;
  try {
    const r = await fetch(`/api/scans/${current.shipment_id}/phone`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    current = d.scan;
    $('phoneBox').innerHTML = phoneHtml(current);
    beep(true);
  } catch (err) { alert('No se pudo guardar: ' + err.message); }
}

function renderSession() {
  const list = [...session.values()];
  $('count').textContent = list.length;
  $('sessTotal').textContent = money(list.reduce((t, s) => t + (s.cost || 0), 0));
  $('hist').innerHTML = list.reverse().map(s => `<li><span>${esc([s.first_name, s.last_name].filter(Boolean).join(' ') || s.receiver_name)}<br><span class="muted" style="font-size:12px">${esc(s.city || '')}</span></span>${s.zone ? `<span style="text-align:right"><span class="zone z-${s.zone}">${ZN[s.zone]}</span><br><span class="price" style="font-size:13px">${money(s.cost)}</span></span>` : '<span class="pill">sin zona</span>'}</li>`).join('');
}

async function send(raw) {
  if (busy) return;
  busy = true;
  $('status').textContent = 'Buscando datos…';
  try {
    const r = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ raw }) });
    if (r.status === 401) { location.href = '/login?next=/escanear'; return; }
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error desconocido');
    const s = d.scan;
    beep(true);
    const name = [s.first_name, s.last_name].filter(Boolean).join(' ') || s.receiver_name || '(sin nombre)';
    $('result').innerHTML = `<div class="result ok">
      <div class="head"><div class="muted" style="font-size:13px">Envío ${esc(s.shipment_id)}${d.repeated ? ' · <b>ya estaba cargado</b>' : ''}</div>${zoneHtml(s)}</div>
      <div class="name">${esc(name)}</div>
      ${s.receiver_name && s.receiver_name !== name ? `<div class="line">Recibe: ${esc(s.receiver_name)}</div>` : ''}
      <div id="phoneBox">${phoneHtml(s)}</div>
      ${s.email ? `<div class="line">${esc(s.email)}</div>` : ''}
      <div class="line">${esc([s.address, s.city].filter(Boolean).join(', '))}</div>
      ${s.items ? `<div class="line muted">${esc(s.items)}</div>` : ''}
      ${saleUrl(s) ? `<div class="line" style="margin-top:6px"><a href="${esc(saleUrl(s))}" target="_blank">Ver venta en Mercado Libre</a></div>` : ''}
      ${suggHtml(s)}
    </div>`;
    current = s;
    bindSugg();
    session.set(s.shipment_id, s);
    renderSession();
    if (needsPhone(s)) setTimeout(() => $('phoneInput') && $('phoneInput').focus(), 50);
  } catch (e) {
    beep(false);
    $('result').innerHTML = `<div class="result err"><b>No se pudo:</b> ${esc(e.message)}</div>`;
  } finally {
    busy = false;
    $('status').textContent = running ? 'Apuntá a la etiqueta…' : '';
  }
}

function onScan(text) {
  const now = Date.now();
  if (text === last.text && now - last.t < 5000) return; // evita leer el mismo QR varias veces seguidas
  last = { text, t: now };
  send(text);
}
async function start() {
  scanner = scanner || new Html5Qrcode('reader');
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; } }, onScan, () => {});
    running = true; $('toggle').textContent = 'Detener cámara'; $('status').textContent = 'Apuntá a la etiqueta…';
  } catch (e) {
    $('status').textContent = 'No se pudo abrir la cámara: ' + (e.message || e) + '. Revisá los permisos del navegador.';
  }
}
async function stop() {
  if (scanner && running) await scanner.stop();
  running = false; $('toggle').textContent = 'Iniciar cámara'; $('status').textContent = '';
}
$('toggle').onclick = () => (running ? stop() : start());
$('manual').onsubmit = (e) => { e.preventDefault(); const v = $('manualId').value.trim(); if (v) send(v); $('manualId').value = ''; };
if (window.Html5Qrcode) start(); else $('status').textContent = 'No se pudo cargar el lector de QR (revisá la conexión).';
</script>
</body>
</html>
